<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">SQLite database and derived search indexes</title>
  <desc id="desc">SQLite is the durable source of truth for conversations, embeddings, claims, summaries and metrics. It maintains an FTS5 keyword index and stores vectors used to build a neighboring HNSW vector index.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .muted { fill: #475569; font-size: 16px; }
      .card { filter: url(#shadow); }
    </style>
  </defs>
  <rect width="1200" height="470" rx="28" fill="url(#bg)"/>
  <text x="52" y="57" font-size="27" font-weight="750">One durable store, two ways to search</text>
  <text x="52" y="85" class="muted">SQLite keeps the actual records; search structures help find them efficiently.</text>

  <g class="card">
    <rect x="52" y="125" width="650" height="286" rx="20" fill="#fff" stroke="#cbd5e1"/>
    <ellipse cx="106" cy="165" rx="30" ry="11" fill="#0f766e"/>
    <path d="M76 165v46c0 6 13 11 30 11s30-5 30-11v-46" fill="#14b8a6"/>
    <ellipse cx="106" cy="211" rx="30" ry="11" fill="#0f766e"/>
    <path d="M76 182c0 6 13 11 30 11s30-5 30-11" fill="none" stroke="#ccfbf1" stroke-width="2"/>
    <text x="157" y="169" font-size="21" font-weight="750">chat_memory.sqlite3</text>
    <rect x="157" y="181" width="154" height="25" rx="12" fill="#ccfbf1"/>
    <text x="172" y="199" font-size="13" font-weight="700" fill="#0f766e">DURABLE SOURCE</text>
    <line x1="78" y1="238" x2="676" y2="238" stroke="#e2e8f0"/>
    <g font-size="16">
      <circle cx="93" cy="269" r="5" fill="#0f766e"/><text x="109" y="275">Conversations, messages, titles, timestamps</text>
      <circle cx="93" cy="304" r="5" fill="#0f766e"/><text x="109" y="310">Message chunks and their embedding vectors</text>
      <circle cx="93" cy="339" r="5" fill="#0f766e"/><text x="109" y="345">Memory claims, sources, summaries, relationships</text>
      <circle cx="93" cy="374" r="5" fill="#0f766e"/><text x="109" y="380">Review state, conflicts, feedback and metrics</text>
    </g>
  </g>

  <path d="M702 267 H764" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M702 330 H764" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g class="card">
    <rect x="780" y="125" width="368" height="124" rx="18" fill="#fff" stroke="#bfdbfe"/>
    <rect x="804" y="150" width="46" height="44" rx="10" fill="#dbeafe"/>
    <text x="815" y="180" font-size="18" font-weight="800" fill="#2563eb">Aa</text>
    <text x="870" y="163" font-size="18" font-weight="750">SQLite FTS5</text>
    <text x="870" y="189" class="muted">Keyword / phrase matching</text>
    <text x="804" y="224" font-size="14" fill="#64748b">Good for names, exact terms, and quoted words</text>
  </g>

  <g class="card">
    <rect x="780" y="280" width="368" height="170" rx="18" fill="#fff" stroke="#c4b5fd"/>
    <g stroke="#7c3aed" stroke-width="2">
      <path d="M820 328l22-15 24 17-22 18z" fill="#ede9fe"/>
      <path d="M820 328v24l24 17v-21M844 348l22-18v24l-22 15"/>
      <path d="M820 352l22-16M844 369l22-15" fill="none"/>
    </g>
    <text x="886" y="316" font-size="18" font-weight="750">HNSW vector index</text>
    <text x="886" y="342" class="muted">Nearest-meaning search</text>
    <text x="804" y="386" font-size="14" fill="#64748b">Derived snapshot beside SQLite;</text>
    <text x="804" y="408" font-size="14" fill="#64748b">rebuilt from vectors stored in the database.</text>
  </g>

  <text x="52" y="490" font-size="14" fill="#64748b">Keep the database and index files together while the app is running. SQLite remains the source of truth.</text>
</svg>
